services:
  postgres-db:
    image: postgres:18.6-alpine3.24
    container_name: rent_a_friend_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data

  backend:
    build:
      context: . 
      dockerfile: ./rent-a-friend-backend/Dockerfile
    container_name: rent_a_friend_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    volumes:
      - ./rent-a-friend-backend:/app/rent-a-friend-backend
      - ./shared:/app/shared
      - /app/rent-a-friend-backend/node_modules
    depends_on:
      - postgres-db

  frontend:
    build: 
      context: .
      dockerfile: ./rent-a-friend-frontend/Dockerfile
    container_name: rent_a_friend_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./rent-a-friend-frontend:/app/rent-a-friend-frontend
      - ./shared:/app/shared
      - /app/rent-a-friend-frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres-db: