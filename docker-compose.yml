services:
  postgres-db:
    image: postgres:18.6-alpine3.24
    hostname: postgres_db
    container_name: rent_a_friend_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-db:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: . 
      dockerfile: ./rent-a-friend-backend/Dockerfile
    container_name: rent_a_friend_backend
    working_dir: /app/rent-a-friend-backend
    ports:
      - "3000:3000"
    env_file:
    - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - ./rent-a-friend-backend:/app/rent-a-friend-backend
      - ./shared:/app/shared
      - /app/shared/node_modules
      - /app/rent-a-friend-backend/node_modules
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build: 
      context: .
      dockerfile: ./rent-a-friend-frontend/Dockerfile
    container_name: rent_a_friend_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./rent-a-friend-frontend:/app/rent-a-friend-frontend
      - ./shared:/app/shared
      - /app/shared/node_modules
      - /app/rent-a-friend-frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres-db: